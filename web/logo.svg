<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 6 22 20">
  <defs>
    <!-- 斜切12度平行四边形（与 favicon.svg 同一图形，透明底 + 紧凑裁剪） -->
    <clipPath id="mark">
      <path d="M10 7h16l-4 18H6z"/>
    </clipPath>
  </defs>
  <!-- 对角条纹：沿 x+y=c 方向（45度），条纹垂直宽 2.4px、周期 5.3px；
       相位对准使左上角（10,7）与右下角（22,25）各切出一个约 2.2px 的三角 -->
  <g clip-path="url(#mark)" fill="#d7ff3f">
    <polygon points="15.8,0 19.2,0 0,19.2 0,15.8"/>
    <polygon points="23.3,0 26.7,0 0,26.7 0,23.3"/>
    <polygon points="30.8,0 34.2,0 0,34.2 0,30.8"/>
    <polygon points="38.3,0 41.7,0 0,41.7 0,38.3"/>
    <polygon points="45.8,0 49.2,0 0,49.2 0,45.8"/>
  </g>
</svg>
