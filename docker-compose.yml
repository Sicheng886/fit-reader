services:
  fit-reader:
    build: .
    image: fit-reader:latest
    container_name: fit-reader
    ports:
      - "3333:3000"
    env_file:
      - .env
    environment:
      # 确保容器内目录与镜像默认值一致
      FIT_INPUT_DIR: /input
      FIT_OUTPUT_DIR: /output
      FIT_DB_PATH: /app/db/fitness.db
    volumes:
      # 必须挂载：输入 FIT 文件与输出结果
      - ./input:/input
      - ./output:/output
      # 强烈建议挂载：训练库持久化（含骑手参数设置），避免容器重建后数据丢失
      - ./db:/app/db
      # 可选：仅在需要调整算法阈值 / 骑手参数出厂默认值时挂载
      # （日常改 FTP / 体重直接在 Web 设置页操作，存训练库）
      - ./settings.js:/app/settings.js
    restart: unless-stopped
